services:
  backend:
    build: ./backend
    environment:
      MODEL_NAME: ${MODEL_NAME:-typeform/distilbert-base-uncased-mnli}
    networks:
      - internal

  frontend:
    build: ./frontend
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:-changeme}
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    networks:
      - internal

networks:
  internal:
    driver: bridge
